name: Probe CFBD (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          K: ${{ secrets.CFBD_KEY }}
        run: |
          exec > probe.txt 2>&1
          echo "key length: ${#K}"
          for B in https://apinext.collegefootballdata.com https://api.collegefootballdata.com; do
            c=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $K" "$B/teams/fbs?year=2026"); echo "$B teams/fbs -> $c count $(jq length /tmp/r.json 2>/dev/null)"
          done
          B=https://apinext.collegefootballdata.com
          get(){ c=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $K" "$B/$1"); echo "== $1 -> $c | count $(jq 'if type=="array" then length else "obj" end' /tmp/r.json 2>/dev/null) | keys $(jq -c 'if type=="array" then (.[0]|keys) else keys end' /tmp/r.json 2>/dev/null | cut -c1-600)"; }
          get "stats/player/season?year=2026&category=receiving"
          jq -c '[.[]|.statType]|unique' /tmp/r.json | cut -c1-300
          jq -c '.[0]|del(.player)' /tmp/r.json | cut -c1-300
          get "stats/player/season?year=2026&category=rushing"; jq -c '[.[]|.statType]|unique' /tmp/r.json
          get "stats/player/season?year=2026&category=passing"; jq -c '[.[]|.statType]|unique' /tmp/r.json
          get "player/usage?year=2026"; jq -c '.[0]|del(.name)' /tmp/r.json | cut -c1-400
          get "ppa/players/season?year=2026"; jq -c '.[0]|del(.name)' /tmp/r.json | cut -c1-500
          get "roster?year=2026"; jq -c '.[0]|del(.firstName,.lastName)' /tmp/r.json | cut -c1-500; jq -c '[.[]|.year]|group_by(.)|map({y:.[0],n:length})' /tmp/r.json
          get "recruiting/players?year=2023&classification=HighSchool"; jq -c '.[0]|del(.name)' /tmp/r.json | cut -c1-400
          get "draft/picks?year=2026"; jq -c '.[0]|del(.name)' /tmp/r.json | cut -c1-300
          echo "calls remaining header:"; curl -sI -H "Authorization: Bearer $K" "$B/teams/fbs?year=2026" | grep -i -E 'remaining|limit' || echo none
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe.txt; git commit -m "probe output"; git push
