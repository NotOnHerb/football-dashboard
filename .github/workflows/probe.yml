name: Probe news (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe.txt 2>&1
          O="Origin: https://notonherb.github.io"
          U="https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/3918298/overview"
          curl -s -o /tmp/r -H "$O" "$U"
          echo "rotowire: $(jq -c '.rotowire' /tmp/r | cut -c1-700)"
          echo "news[0..3]: $(jq -c '.news[0:4]|map({headline,published,type,link:(.links.web.href // null),desc:(.description|tostring|.[0:90])})' /tmp/r | cut -c1-1200)"
          echo "nextGame keys: $(jq -c '.nextGame|keys? // .nextGame' /tmp/r | cut -c1-200)"
          echo "fantasy keys: $(jq -c '.fantasy|keys? // .fantasy' /tmp/r | cut -c1-200)"
          U2="https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/4426515/overview"
          curl -s -o /tmp/r2 -H "$O" "$U2"; echo "puka rotowire: $(jq -c '.rotowire' /tmp/r2 | cut -c1-500)"; echo "puka news count: $(jq '.news|length' /tmp/r2) first: $(jq -c '.news[0].headline' /tmp/r2)"
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe.txt; git commit -m "probe output"; git push
