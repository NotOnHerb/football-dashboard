name: Probe ESPN (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe.txt 2>&1
          for H in lm-api-reads.fantasy.espn.com fantasy.espn.com; do
            U="https://$H/apis/v3/games/ffl/seasons/2026/segments/0/leagues/12345?view=mSettings"
            echo "== $H"; curl -s -o /tmp/r -w 'status %{http_code}\n' -H "Origin: https://notonherb.github.io" "$U"; head -c 200 /tmp/r; echo
            echo "-- CORS headers on GET:"; curl -s -D - -o /dev/null -H "Origin: https://notonherb.github.io" "$U" | grep -i -E '^access-control|^vary' || echo "(none)"
            echo "-- preflight:"; curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://notonherb.github.io" -H "Access-Control-Request-Method: GET" "$U" | grep -i -E '^HTTP|^access-control' || echo "(none)"
          done
          echo "== players endpoint (public data)"; curl -s -o /tmp/p -w 'status %{http_code}\n' -H 'X-Fantasy-Filter: {"players":{"limit":2}}' "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026/players?view=players_wl"; head -c 300 /tmp/p; echo
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe.txt; git commit -m "probe output"; git push
