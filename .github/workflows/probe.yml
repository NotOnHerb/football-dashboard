name: Probe odds (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          K: ${{ secrets.ODDS_API_KEY }}
        run: |
          exec > probe.txt 2>&1
          echo "key length: ${#K}"
          B=https://api.the-odds-api.com/v4/sports/americanfootball_nfl
          c=$(curl -s -D /tmp/h -o /tmp/ev -w '%{http_code}' "$B/events?apiKey=$K"); echo "events -> $c count $(jq length /tmp/ev 2>/dev/null)"; grep -i 'x-requests' /tmp/h
          echo "event keys: $(jq -c '.[0]|keys' /tmp/ev)"; echo "first events: $(jq -c '.[0:3]|map({home_team,away_team,commence_time})' /tmp/ev)"
          c=$(curl -s -D /tmp/h -o /tmp/od -w '%{http_code}' "$B/odds?apiKey=$K&regions=us&markets=h2h,spreads,totals&oddsFormat=american"); echo "odds -> $c games $(jq length /tmp/od)"; grep -i 'x-requests' /tmp/h
          echo "bookmakers on game 1: $(jq -c '.[0].bookmakers|map(.key)' /tmp/od)"
          echo "game 1 sample: $(jq -c '.[0]|{home_team,away_team,bm:(.bookmakers[0]|{key,last_update,markets:(.markets|map({key,outcomes}))})}' /tmp/od | cut -c1-900)"
          EID=$(jq -r '.[0].id' /tmp/ev)
          c=$(curl -s -D /tmp/h -o /tmp/pp -w '%{http_code}' "$B/events/$EID/odds?apiKey=$K&regions=us&markets=player_pass_yds,player_rush_yds,player_reception_yds,player_receptions,player_anytime_td,player_pass_tds&oddsFormat=american"); echo "props -> $c"; grep -i 'x-requests' /tmp/h
          echo "props bookmakers: $(jq -c '.bookmakers|map({key,m:(.markets|map(.key))})' /tmp/pp | cut -c1-600)"
          echo "prop sample: $(jq -c '.bookmakers[0].markets[0]|{key,outcomes:.outcomes[0:4]}' /tmp/pp | cut -c1-600)"
          echo "anytime td sample: $(jq -c '[.bookmakers[].markets[]|select(.key=="player_anytime_td")][0].outcomes[0:3]' /tmp/pp | cut -c1-300)"
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe.txt; git commit -m "probe output"; git push
