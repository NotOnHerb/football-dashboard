name: Refresh data

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python build.py
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
      - name: Save the new site
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html data.json
          git diff --staged --quiet || git commit -m "Refresh data"
          git push
