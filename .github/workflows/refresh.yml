name: Refresh data

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      props:
        description: 'Player props: auto (on schedule), all (fetch any missing this week), off'
        default: 'auto'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python build.py
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_PLAN: ${{ vars.ODDS_PLAN || 'free' }}
          ODDS_PROPS: ${{ github.event.inputs.props || 'auto' }}
      - name: Save the new site
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html data.json
          if [ -d odds ]; then git add odds; fi
          git diff --staged --quiet || git commit -m "Refresh data"
          git push
